oracle_nav_pose:
  _target_                   : 'habitat_llm.tools.motor_skills.MotorSkillTool'
  _recursive_                : False

  skill_config                :
    skill                      :
      _target_                 : "habitat_llm.tools.motor_skills.OracleNavPoseSkill"
      _partial_                : True

    name                       : 'NavigatePose'
    description                : 'Used for navigating to a given pose. You must provide the target pose you want to navigate to. Example (NavigatePose[target_position])'
    max_skill_steps            : 600
    force_end_on_timeout       : True

    dist_thresh                : 2.0
    turn_thresh                : 1.5
    forward_velocity           : 10.0
    turn_velocity              : 10.0
    sim_freq                   : 120 # Hz
    enable_backing_up          : False
    # Disable exploration
    enable_exploration         : False
